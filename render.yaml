services:
  - type: web
    name: two-quill-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SQLITE_PATH
        value: two-quill.sqlite
      - key: FRONTEND_URL
        sync: false
